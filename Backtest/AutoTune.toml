# Real-candle Monte Carlo tuning. Each path is one random, contiguous 50% window.
# Candidate passes only when every path passes every hard limit.

[search]
training_fraction = 0.50
paths = 8
candidates = 48
seed = 42
duration_minutes = 30

[constraints]
minimum_total_trades = 280
maximum_total_trades = 320
minimum_win_rate = 0.70
minimum_roi_pct = 34.9165
minimum_max_drawdown_pct = -65.0
minimum_roi_to_drawdown = 2.0

[ranges]
rdma_fast_half_life_min   = 15
rdma_fast_half_life_max   = 35
rdma_medium_half_life_min = 60
rdma_medium_half_life_max = 140
rdma_slow_half_life_min   = 180
rdma_slow_half_life_max   = 320
min_direction_bars_min    = 10
min_direction_bars_max    = 40
