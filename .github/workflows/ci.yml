name: CI

on:
  push:
    branches: [main, development, "rebuild/**"]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run basedpyright Backtest Dataframe Live SharedParams Storage Strategy Main.py
      - run: uv run pytest -q
      - run: cargo fmt --manifest-path Strategy/Rust/Cargo.toml --check
      - run: cargo clippy --manifest-path Strategy/Rust/Cargo.toml --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: cargo test --manifest-path Strategy/Rust/Cargo.toml
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Production LOC gate
        run: |
          count=$(find . -type f \( -name '*.py' -o -name '*.rs' \) \
            | grep -v -E '/(\.venv|target|tests)/|/test_' \
            | xargs wc -l | tail -1 | awk '{print $1}')
          echo "Production LOC: $count"
          test "$count" -le 10000
